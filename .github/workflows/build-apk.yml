name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Stamp build metadata and version.json
        run: |
          cat > src/buildInfo.ts << 'EOF'
          export const BUILD_INFO = {
            version: '1.0.${{ github.run_number }}',
            runNumber: ${{ github.run_number }},
            commit: '${{ github.sha }}',
          };
          EOF
          cat > version.json << 'EOF'
          {
            "version": "1.0.${{ github.run_number }}",
            "run_number": ${{ github.run_number }},
            "commit": "${{ github.sha }}",
            "apk_url": "https://github.com/Xerman09/task-management-mobile/releases/download/latest-apk/TaskFlow.apk"
          }
          EOF

      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Enable cleartext HTTP and APK compression/shrinking
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          fi
          PROPS="android/gradle.properties"
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' "$PROPS"
          if ! grep -q 'android.enableMinifyInReleaseBuilds' "$PROPS"; then
            echo "android.enableMinifyInReleaseBuilds=true" >> "$PROPS"
          else
            sed -i 's/^android.enableMinifyInReleaseBuilds=.*/android.enableMinifyInReleaseBuilds=true/' "$PROPS"
          fi
          if ! grep -q 'android.enableShrinkResourcesInReleaseBuilds' "$PROPS"; then
            echo "android.enableShrinkResourcesInReleaseBuilds=true" >> "$PROPS"
          else
            sed -i 's/^android.enableShrinkResourcesInReleaseBuilds=.*/android.enableShrinkResourcesInReleaseBuilds=true/' "$PROPS"
          fi
          if ! grep -q 'android.enablePngCrunchInReleaseBuilds' "$PROPS"; then
            echo "android.enablePngCrunchInReleaseBuilds=true" >> "$PROPS"
          fi

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for download
        run: cp android/app/build/outputs/apk/release/app-release.apk TaskFlow.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Android-APK
          path: TaskFlow.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: TaskFlow Mobile APK (Latest)
          body: Latest Android APK build from `main` (`${{ github.sha }}`).
          files: |
            TaskFlow.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

